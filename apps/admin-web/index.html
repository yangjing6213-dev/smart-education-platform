<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页内容管理</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2937;
        background: #f4f6f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f4f6f8;
      }

      button {
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
      }

      .topbar {
        align-items: stretch;
        background: #ffffff;
        border-right: 1px solid #d9e0e7;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        justify-content: flex-start;
        overflow-y: auto;
        padding: 24px 16px;
        position: sticky;
        top: 0;
        width: 264px;
        z-index: 10;
      }

      .brand {
        color: #0f766e;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .topbar span {
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }

      .nav-toggle {
        display: none;
      }

      .topbar nav {
        display: grid;
        gap: 4px;
        width: 100%;
      }

      .topbar nav button {
        background: transparent;
        border-radius: 8px;
        color: #334155;
        text-align: left;
        width: 100%;
      }

      .topbar nav button:hover,
      .topbar nav button[aria-current="page"] {
        background: #e6f4f1;
        color: #0f766e;
      }

      main {
        margin: 0 auto;
        min-width: 0;
        max-width: 1120px;
        padding: 36px clamp(20px, 5vw, 64px) 64px;
      }

      .shell > :not(.topbar) {
        grid-column: 2;
        min-width: 0;
        width: 100%;
      }

      .heading-row {
        align-items: end;
        display: flex;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(26px, 4vw, 38px);
        letter-spacing: 0;
      }

      .heading-row p {
        color: #64748b;
        font-size: 14px;
        margin-top: 8px;
      }

      .status {
        align-items: center;
        color: #475569;
        display: flex;
        font-size: 13px;
        gap: 8px;
        white-space: nowrap;
      }

      .status::before {
        background: #f59e0b;
        border-radius: 50%;
        content: "";
        height: 8px;
        width: 8px;
      }

      .workspace {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr) 300px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        min-width: 0;
        overflow-x: auto;
        padding: 24px;
      }

      .learning-safety-version {
        color: #475569;
        font-size: 14px;
        font-weight: 700;
        margin: 16px 0 10px;
      }

      .learning-safety-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      }

      .learning-safety-metric {
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: space-between;
        min-height: 104px;
        min-width: 0;
        padding: 16px;
      }

      .learning-safety-metric span {
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }

      .learning-safety-metric strong {
        color: #0f172a;
        font-size: 20px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .learning-safety-note {
        color: #64748b;
        line-height: 1.7;
        margin-top: 20px;
      }

      .panel h2 {
        font-size: 16px;
        margin-bottom: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      .field label {
        color: #475569;
        font-size: 13px;
        font-weight: 600;
      }

      .field strong {
        font-size: 18px;
      }

      .summary {
        color: #475569;
        line-height: 1.6;
      }

      .block-list {
        display: grid;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .block-list li {
        background: #f8fafc;
        border-left: 3px solid #0f766e;
        padding: 12px 14px;
      }

      .block-kind {
        color: #0f766e;
        display: block;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .meta {
        display: grid;
        gap: 14px;
        margin-bottom: 24px;
      }

      .meta div {
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        padding-bottom: 12px;
      }

      .meta dt {
        color: #64748b;
        font-size: 13px;
      }

      .meta dd {
        font-size: 13px;
        font-weight: 700;
        margin: 0;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      .save {
        background: #e2e8f0;
        color: #1e293b;
      }

      .publish {
        background: #0f766e;
        color: #ffffff;
      }

      .notice {
        color: #64748b;
        font-size: 12px;
        line-height: 1.5;
        margin-top: 16px;
      }

      [data-statistics-page] {
        display: grid;
        gap: 20px;
      }

      [data-statistics-page] > form {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      [data-statistics-page] label {
        color: #475569;
        display: grid;
        flex: 1 1 180px;
        font-size: 13px;
        font-weight: 600;
        gap: 8px;
      }

      [data-statistics-page] input,
      [data-statistics-page] select {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
        min-height: 42px;
        padding: 8px 10px;
        width: 100%;
      }

      [data-statistics-page] [data-statistics-status],
      [data-statistics-page] [data-operational-statistics] > p {
        color: #475569;
        line-height: 1.6;
      }

      [data-statistics-page] [data-operational-statistics] {
        display: grid;
        gap: 16px;
      }

      [data-statistics-page] .review-values {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        margin: 0;
      }

      [data-statistics-page] .review-values > div {
        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        padding: 16px;
      }

      [data-statistics-page] .review-values dt {
        color: #64748b;
        font-size: 13px;
      }

      [data-statistics-page] .review-values dd {
        font-size: 20px;
        font-weight: 700;
        margin: 6px 0 0;
      }

      [data-statistics-page] [data-statistics-group] {
        margin-top: 12px;
      }

      [data-statistics-page] [data-statistics-group] ul {
        margin: 12px 0 0;
        overflow-wrap: anywhere;
        padding-left: 20px;
      }

      [data-statistics-page] .review-actions {
        display: flex;
        gap: 12px;
      }

      [data-statistics-page] a {
        color: #0f766e;
        text-underline-offset: 4px;
      }

      @media (max-width: 760px) {
        .shell {
          display: block;
        }

        .topbar {
          align-items: center;
          border-bottom: 1px solid #d9e0e7;
          border-right: 0;
          flex-direction: row;
          gap: 12px;
          height: auto;
          min-height: 64px;
          overflow: visible;
          padding: 12px 16px;
          width: 100%;
          z-index: 25;
        }

        .brand {
          font-size: 14px;
          white-space: nowrap;
        }

        .topbar span {
          font-size: 11px;
          margin-left: auto;
          max-width: 110px;
          text-align: right;
        }

        .nav-toggle {
          background: #e6f4f1;
          color: #0f766e;
          display: inline-flex;
          flex: 0 0 auto;
          padding: 8px 12px;
        }

        .topbar nav {
          background: #ffffff;
          bottom: 0;
          box-shadow: 12px 0 32px rgb(15 23 42 / 18%);
          left: 0;
          max-width: 280px;
          overflow-y: auto;
          padding: 24px 12px;
          position: fixed;
          top: 0;
          transform: translateX(-105%);
          transition: transform 180ms ease;
          visibility: hidden;
          width: min(82vw, 280px);
          z-index: 30;
        }

        .shell.nav-open::before {
          background: rgb(15 23 42 / 34%);
          content: "";
          inset: 0;
          position: fixed;
          z-index: 20;
        }

        .shell.nav-open .topbar nav {
          transform: translateX(0);
          visibility: visible;
        }

        .shell > :not(.topbar) {
          width: 100%;
        }

        main,
        .heading-row {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding: 24px 16px 40px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
