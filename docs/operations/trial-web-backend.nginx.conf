# Optional http {} include for the two server-side Next clients on the same trusted host.
map $http_host $trial_web_backend_authority {
    default 0;
    nest-internal.example.invalid:8443 1;
}
map $http_authorization $trial_web_backend_bearer {
    default "";
    "~^Bearer [A-Za-z0-9_-]{43}$" $http_authorization;
}
log_format trial_web_backend_status '$time_iso8601 $status $upstream_status $request_time';

server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
    return 421;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name nest-internal.example.invalid;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/trial-web-backend/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/trial-web-backend/privkey.pem;

    access_log /var/log/nginx/trial-web-backend-status.log trial_web_backend_status;
    error_log /dev/null;
    if ($ssl_server_name != $server_name) { return 421; }
    if ($trial_web_backend_authority = 0) { return 421; }

    location / {
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "";
        proxy_set_header Host $server_name;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Authorization $trial_web_backend_bearer;
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:4321;
    }
}
