# Optional sibling of trial-web.nginx.conf. Include inside http {} only when Mini TLS is ready.
log_format trial_mini_status 'time=$time_iso8601 status=$status upstream=$upstream_status duration=$request_time';

map $http_host $trial_mini_hostname {
    default "";
    mini-api.example.invalid mini-api.example.invalid;
    mini-api.example.invalid:443 mini-api.example.invalid;
}

upstream trial_mini_nest {
    server 127.0.0.1:4321;
}

# Explicit rollout switch; the two web sites do not depend on it.
map $ssl_server_name $trial_mini_enabled {
    default 0;
    # mini-api.example.invalid 1;
}

map $request $trial_mini_origin_form {
    default 0;
    "~^[A-Z]+ /" 1;
}

# Match the original request target. Never turn an encoded or normalized alias
# into a public API path. @ below is generated only by these UUID rules.
map $request_uri $trial_mini_shape {
    default "";
    "~^/public/meals\?date=[0-9]{4}-[0-9]{2}-[0-9]{2}&public_ref=(?:[a-zA-Z0-9._~-]|%7[Ee]){1,128}$" @public-meals;
    "~^/parent/relationships/(?i:[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})/monthly-reports/(?i:[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})/ack$" /parent/relationships/@/monthly-reports/@/ack;
    "~^(?<mini_path_before>/[a-z-]+(?:/[a-z-]+)*)/(?i:[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})(?<mini_path_after>(?:/[a-z-]+)*)$" "$mini_path_before/@$mini_path_after";
    "~^/[a-z-]+(?:/[a-z-]+)*$" $request_uri;
}

map "$request_method:$trial_mini_shape" $trial_mini_access {
    default denied;
    ~^GET:@public-meals$ public;
    ~^POST:/identity/login$ login;
    ~^POST:/identity/logout$ session;

    "~^GET:/(?:me|consent-policies|consents|guardian-relationships|guardian-binding/applications)$" session;
    "~^POST:/(?:consents|consents/@/revoke|guardian-binding/applications|guardian-relationships/@/release)$" session;

    "~^GET:/parent/(?:care-records|fees|health-incidents|learning|leave-requests|notices|pickup|student-options)$" session;
    "~^GET:/parent/(?:relationships/@/monthly-reports|students/@/learning-sessions)$" session;
    "~^POST:/parent/(?:care-records/@/receipt|(?:health-incidents|notices)/@/(?:read|ack))$" session;
    "~^POST:/parent/(?:learning/@/(?:contact|controls)|learning-sessions/@/(?:answer|close|hint)|students/@/learning-sessions)$" session;
    "~^POST:/parent/(?:leave-requests|leave-requests/@/(?:acknowledge|resubmit|withdraw)|relationships/@/monthly-reports/@/ack)$" session;
    "~^POST:/parent/pickup/authorizations(?:/@/(?:activate|credential|revoke))?$" session;

    "~^GET:/staff/(?:care-record-students|care-records|child-monthly-reports|daily-reports|guardian-binding/applications|leave-requests|monthly-feedback|health-incidents/(?:drafts|students))$" session;
    "~^POST:/staff/(?:care-records|child-monthly-reports|daily-reports|health-incidents|monthly-feedback)$" session;
    "~^PATCH:/staff/(?:child-monthly-reports|daily-reports|monthly-feedback)/@$" session;
    "~^POST:/staff/care-records/@/(?:publish|resubmit|review|revoke-publication|submit|withdraw)$" session;
    "~^POST:/staff/(?:child-monthly-reports|health-incidents|monthly-feedback)/@/submit$" session;
    "~^POST:/staff/(?:daily-reports/@/(?:resubmit|submit)|guardian-binding/applications/@/review|leave-requests/@/review|pickup/credentials/(?:confirm|preview))$" session;
}

map "$trial_mini_access:$http_authorization" $trial_mini_authorization {
    default "";
    "~^session:Bearer [A-Za-z0-9_-]{43}$" $http_authorization;
}

map "$request_method:$trial_mini_shape:$http_content_type" $trial_mini_media_ok {
    default 0;
    ~^GET: 1;
    ~^POST:/identity/logout:$ 1;
    "~*^(?:POST|PATCH):[^:]+:application/json(?:;\s*charset=utf-8)?$" 1;
}
map $request_method $trial_mini_media {
    default application/json;
    GET "";
}

map $trial_mini_access $trial_mini_login_key {
    default "";
    login $binary_remote_addr;
}
limit_req_zone $trial_mini_login_key zone=trial_mini_logins:1m rate=10r/m;

server {
    listen 443 ssl;
    server_name mini-api.example.invalid;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/trial-mini/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/trial-mini/privkey.pem;

    access_log /var/log/nginx/trial-mini-status.log trial_mini_status;
    add_header Cache-Control "no-store" always;
    # Nginx's error format can include the original request. Keep only status metrics here.
    error_log /dev/null;

    if ($ssl_server_name != $server_name) { return 421; }
    if ($trial_mini_hostname != $server_name) { return 421; }
    if ($trial_mini_enabled = 0) { return 404; }
    if ($trial_mini_origin_form = 0) { return 400; }
    if ($trial_ambiguous_path) { return 400; }
    if ($trial_mini_access = denied) { return 404; }
    if ($trial_mini_media_ok = 0) { return 415; }

    location / {
        limit_req zone=trial_mini_logins burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "";
        proxy_set_header Host $server_name;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Type $trial_mini_media;
        proxy_set_header Authorization $trial_mini_authorization;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_pass http://trial_mini_nest;
    }
}

