# Include once inside http {}. See trial-web-ingress.md before substituting site values.
upstream trial_user_web {
    server 127.0.0.1:3101;
}
upstream trial_admin_web {
    server 127.0.0.1:3102;
}

map $http_host $trial_host_allowed {
    default 0;
    trial.example.invalid 1;
    trial.example.invalid:443 1;
}

# Reject ambiguous path encodings before proxying. Query values may contain encoded separators.
map $request_uri $trial_ambiguous_path {
    default 0;
    "~*^[^?]*(?:%2f|%5c|%25|%2e|\\x5c)" 1;
    "~^[^?]*/\\.\\.?(?:/|\\?|$)" 1;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    server_name trial.example.invalid;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/trial-web/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/trial-web/privkey.pem;

    # Keep site logging unchanged for valid requests; never log a misdirected Mini request.
    error_page 421 = @trial_web_misdirected;
    if ($ssl_server_name != $server_name) { return 421; }
    if ($trial_host_allowed = 0) { return 421; }
    if ($trial_ambiguous_path) { return 400; }

    location @trial_web_misdirected {
        access_log off;
        error_log /dev/null;
        return 421;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Rewrite-URL "";
    proxy_set_header X-Middleware-Subrequest "";
    proxy_set_header X-Matched-Path "";
    proxy_set_header X-Invoke-Path "";

    location ^~ /admin-static/_next/static/ { proxy_pass http://trial_admin_web; }
    location ^~ /_next/static/ { proxy_pass http://trial_user_web; }
    location = /icon.png { proxy_pass http://trial_admin_web; }
    location ~ ^/(?:admin|api/admin)(?:/|$) { proxy_pass http://trial_admin_web; }

    location = / { proxy_pass http://trial_user_web; }
    location ^~ /assets/ { proxy_pass http://trial_user_web; }
    location ~ ^/(?:web|visitor|api-local)(?:/|$) { proxy_pass http://trial_user_web; }
    location / { return 404; }
}
